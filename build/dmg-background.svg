<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#DDE6F2"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9DB3D0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9DB3D0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9DB3D0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="540" height="380" fill="url(#bg)"/>

  <text x="270" y="60" text-anchor="middle"
        font-family="-apple-system, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#1B3557">Grander Commander</text>

  <text x="270" y="88" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" fill="#5B7290">Drag the app into your Applications folder</text>

  <!-- The icons sit at y=180 (config); the arrow threads between them. -->
  <g transform="translate(270,180)">
    <path d="M -42 0 L 26 0" stroke="#7C93B4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 24 -11 L 44 0 L 24 11 Z" fill="#7C93B4"/>
  </g>

  <rect x="90" y="292" width="360" height="1" fill="url(#rule)"/>
  <text x="270" y="322" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" fill="#7C93B4">Signed and notarized · grnd/grander-commander</text>
</svg>
