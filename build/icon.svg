<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep blue, echoing Total Commander's classic panel chrome. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C6BB5"/>
      <stop offset="1" stop-color="#14315C"/>
    </linearGradient>
    <linearGradient id="paneActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <linearGradient id="paneIdle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3DEEC"/>
      <stop offset="1" stop-color="#B6C6DC"/>
    </linearGradient>
    <!-- Big Sur icons sit on a rounded square with a soft top light. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#08182F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS squircle: 1024 grid, art inset to the standard 824 safe area. -->
  <g transform="translate(100,100)">
    <rect width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>

    <g filter="url(#drop)">
      <!-- Left pane: active, brighter, with a selected row. -->
      <rect x="86" y="150" width="308" height="524" rx="26" fill="url(#paneActive)"/>
      <rect x="86" y="150" width="308" height="60" rx="26" fill="#3E7FD0"/>
      <rect x="86" y="184" width="308" height="26" fill="#3E7FD0"/>

      <!-- Right pane: inactive, receded. -->
      <rect x="430" y="150" width="308" height="524" rx="26" fill="url(#paneIdle)"/>
      <rect x="430" y="150" width="308" height="60" rx="26" fill="#7E97B8"/>
      <rect x="430" y="184" width="308" height="26" fill="#7E97B8"/>
    </g>

    <!-- Left pane rows; the third is the cursor row. -->
    <g fill="#9FB3CC">
      <rect x="126" y="248" width="228" height="22" rx="11"/>
      <rect x="126" y="300" width="196" height="22" rx="11"/>
    </g>
    <rect x="106" y="344" width="268" height="42" rx="12" fill="#F5A623"/>
    <g fill="#9FB3CC">
      <rect x="126" y="410" width="212" height="22" rx="11"/>
      <rect x="126" y="462" width="168" height="22" rx="11"/>
      <rect x="126" y="514" width="228" height="22" rx="11"/>
      <rect x="126" y="566" width="150" height="22" rx="11"/>
    </g>

    <!-- Right pane rows, dimmer to read as unfocused. -->
    <g fill="#93A7C0" opacity="0.75">
      <rect x="470" y="248" width="212" height="22" rx="11"/>
      <rect x="470" y="300" width="168" height="22" rx="11"/>
      <rect x="470" y="352" width="228" height="22" rx="11"/>
      <rect x="470" y="404" width="150" height="22" rx="11"/>
      <rect x="470" y="456" width="196" height="22" rx="11"/>
      <rect x="470" y="508" width="212" height="22" rx="11"/>
      <rect x="470" y="560" width="176" height="22" rx="11"/>
    </g>
  </g>
</svg>
