name: CI

on:
  pull_request:
  push:
    branches:
      - master

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    # Matches the release job: node-pty and electron-builder's install step
    # build native modules against macOS here, same as the shipped app.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The renderer and main bundles have to build before a release can be
      # cut; failing here is cheaper than failing during a tag build.
      - name: Build
        run: npm run build
