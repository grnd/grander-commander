name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and notarize macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          node -e 'const pkg = require("./package.json"); const actual = process.env.GITHUB_REF_NAME; const expected = `v${pkg.version}`; if (actual !== expected) { console.error(`Release tag ${actual} does not match package.json version ${expected}`); process.exit(1); }'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # electron-builder publishes the DMG, the ZIP and latest-mac.yml. The
      # ZIP and the manifest are what electron-updater actually reads; a
      # DMG-only release cannot be auto-updated from.
      - name: Build, sign, notarize and publish
        run: npm run dist:universal -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application cert (base64 .p12) + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization credentials.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder creates the release but leaves the body empty, so fill
      # it in afterwards. GitHub picks the previous release as the baseline and
      # lists merged PRs, which keeps release-chore commits out of the notes.
      - name: Add "What's Changed" release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > /tmp/notes.md
          echo "--- generated notes ---"
          cat /tmp/notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
