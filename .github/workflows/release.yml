name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and notarize macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release-notes fallback below diffs this
          # tag against the previous one, which a depth-1 checkout cannot do.
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          node -e 'const pkg = require("./package.json"); const actual = process.env.GITHUB_REF_NAME; const expected = `v${pkg.version}`; if (actual !== expected) { console.error(`Release tag ${actual} does not match package.json version ${expected}`); process.exit(1); }'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # electron-builder publishes the DMG, the ZIP and latest-mac.yml. The
      # ZIP and the manifest are what electron-updater actually reads; a
      # DMG-only release cannot be auto-updated from.
      - name: Build, sign, notarize and publish
        run: npm run dist:universal -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application cert (base64 .p12) + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization credentials.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder creates the release but leaves the body empty, so fill
      # it in afterwards.
      #
      # GitHub's generate-notes lists merged *pull requests*. A release merged
      # straight to master has none, and v0.2.0 shipped with a body containing
      # nothing but a Full Changelog link. So the commit log is the fallback,
      # and the step fails outright rather than publishing empty notes again.
      - name: Add "What's Changed" release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > /tmp/notes.md

          if ! grep -qE '^[[:space:]]*[*-] ' /tmp/notes.md; then
            echo "generate-notes listed no pull requests; falling back to the commit log"
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            RANGE="${TAG}"
            # An explicit if, not `[ ... ] && RANGE=...`: under `set -e` a false
            # test as the last command of an && list exits the script, which
            # would break the very first release (no previous tag to find).
            if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; fi
            {
              echo "## What's Changed"
              echo
              git log --no-merges --pretty='- %s' "$RANGE"
              if [ -n "$PREV" ]; then
                echo
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              fi
            } > /tmp/notes.md
          fi

          echo "--- release notes ---"
          cat /tmp/notes.md

          # Never publish an empty body again, silently or otherwise.
          if ! grep -qE '^[[:space:]]*[*-] ' /tmp/notes.md; then
            echo "::error::release notes are empty — neither pull requests nor commits were found for $TAG"
            exit 1
          fi

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
